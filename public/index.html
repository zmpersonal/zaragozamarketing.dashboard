<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support console</title>
<style>
  :root {
    --ground: #e6ebe9;
    --surface: #fcfdfc;
    --line: #ccd6d3;
    --pine: #16241f;
    --steam: #6d817b;
    --plunge: #2c6b8b;
    --brass: #a8791f;
    --ember: #9e3d16;
    --radius: 3px;
    --sans: ui-sans-serif, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  /* The hidden attribute must win over any display rule (round 11: "Blocked on" showed for every status). */
  [hidden] { display: none !important; }

  body {
    margin: 0;
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    color: var(--pine);
    background: var(--ground);
    -webkit-font-smoothing: antialiased;
  }

  button { font: inherit; color: inherit; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- shell ---------- */
  .shell {
    display: grid;
    grid-template-columns: 172px minmax(0, 1fr) 340px;
    min-height: 100vh;
  }

  .rail {
    background: var(--pine);
    color: #cfdad6;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }
  .rail h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #fff;
  }
  .rail .who { font-size: 12px; color: #7f938d; margin-top: 3px; }
  .rail nav { display: flex; flex-direction: column; gap: 1px; }
  .rail nav button {
    background: none; border: 0; text-align: left;
    padding: 6px 8px; border-radius: var(--radius);
    color: #a9bab5; font-size: 13px;
  }
  .rail nav button[aria-pressed="true"] { background: #263a33; color: #fff; }
  .rail nav button:focus-visible { outline: 2px solid var(--plunge); outline-offset: 1px; }
  .rail .heading {
    font-size: 12px; color: #6d827c; margin-bottom: 7px;
  }

  main { padding: 22px 26px 60px; min-width: 0; }

  .head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; margin-bottom: 16px;
  }
  .head h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.015em; }
  .head p { margin: 0; font-size: 13px; color: var(--steam); }

  /* ---------- the matrix: brands down, channels across ---------- */
  .matrix {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 30px;
  }
  .matrix th, .matrix td {
    padding: 0; text-align: left;
    border-bottom: 1px solid var(--line);
  }
  .matrix tr:last-child th, .matrix tr:last-child td { border-bottom: 0; }
  .matrix thead th {
    font-size: 12px; font-weight: 500; color: var(--steam);
    padding: 9px 14px; background: #f3f6f5;
  }
  .matrix tbody th {
    font-weight: 600; font-size: 14px; padding: 0 14px;
    width: 190px; white-space: nowrap;
  }
  .matrix td { border-left: 1px solid var(--line); }

  .cell {
    display: block; width: 100%; background: none; border: 0;
    padding: 11px 14px 13px; text-align: left;
  }
  .cell:hover { background: #f1f5f4; }
  .cell:focus-visible { outline: 2px solid var(--plunge); outline-offset: -2px; }
  .cell .count {
    font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1;
  }
  .cell .oldest { font-size: 12px; color: var(--steam); margin-top: 4px; }
  .cell.quiet .count { color: #b4c1bd; font-weight: 400; }
  .cell .oldest.warning { color: #6b4c12; }
  .cell .oldest.error { color: var(--ember); font-weight: 500; }
  .sub.error { color: var(--ember); }

  /* Heat bar: how long the oldest unanswered item has been sitting.
     Cold plunge blue when fresh, sauna ember when it has been too long. */
  .heat { height: 3px; margin-top: 8px; background: #dde5e3; border-radius: 2px; }
  .heat span { display: block; height: 100%; border-radius: 2px; }

  /* ---------- queue ---------- */
  .filters { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .filters button {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 20px; padding: 3px 11px; font-size: 12.5px; color: var(--steam);
  }
  .filters button[aria-pressed="true"] {
    background: var(--pine); border-color: var(--pine); color: #fff;
  }

  .queue { display: flex; flex-direction: column; gap: 1px; background: var(--line);
           border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .row {
    display: grid;
    grid-template-columns: 4px 96px minmax(0,1fr) 128px 92px;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 0; padding: 0; text-align: left; width: 100%;
  }
  .row:hover { background: #f2f6f5; }
  .row[aria-selected="true"] { background: #e8f0f2; }
  .row:focus-visible { outline: 2px solid var(--plunge); outline-offset: -2px; }
  .row .edge { align-self: stretch; }
  .row .age { font-size: 14px; font-weight: 600; padding: 11px 0; white-space: nowrap; }
  .row .body { min-width: 0; padding: 10px 0; }
  .row .subject {
    font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .snippet { font-weight: 400; color: var(--steam); }

  /* --- the admin view (round 15) --- */
  .filters .filter-sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  .open-link { display: inline-block; margin-top: 8px; font-size: 12.5px; }
  .stats { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 20px; }
  .stat { flex: 1 1 160px; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: #fff; }
  .stat-label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--steam); }
  .stat-value { font-size: 26px; font-weight: 600; line-height: 1.2; margin: 2px 0; }
  .stat-sub { font-size: 12px; color: var(--steam); }
  table.buckets { width: 100%; border-collapse: collapse; margin: 8px 0 20px; font-size: 13.5px; }
  table.buckets th, table.buckets td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: right; }
  table.buckets thead th { font-size: 12px; color: var(--steam); font-weight: 500; }
  table.buckets tbody th { text-align: left; font-weight: 500; }
  table.buckets td.late { color: var(--ember); font-weight: 600; }
  table.buckets td.total { font-weight: 600; }
  ul.answered-list { list-style: none; margin: 0; padding: 0; }
  li.answered { border-bottom: 1px solid var(--line); padding: 10px 0; }
  .answered-head { display: flex; gap: 8px; align-items: baseline; }
  .answered-when { font-size: 12.5px; color: var(--steam); width: 52px; flex: none; }
  .answered-subject { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .answered-who, .answered-said { font-size: 12.5px; color: var(--steam); margin-left: 60px; }
  .answered-said { color: var(--ink); margin-top: 2px; }
  .answered-link { display: inline-block; margin: 4px 0 0 60px; font-size: 12.5px; }
  .quiet { color: var(--steam); font-style: italic; }
  .row .from {
    font-size: 12.5px; color: var(--steam);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .meta { font-size: 12.5px; color: var(--steam); }
  .row .who { font-size: 12.5px; color: var(--steam); }

  .chip {
    display: inline-block; font-size: 11.5px; padding: 1px 7px;
    border-radius: 20px; border: 1px solid currentColor;
  }

  /* ---------- queue sections: needs reply / probably not customers / spam ---------- */
  .queue-section + .queue-section { margin-top: 22px; }
  .section-title { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--pine); }
  .section-title.section-bulk, .section-title.section-spam { color: var(--steam); }
  .section-empty { margin: 0; font-size: 12.5px; color: var(--steam); }
  .chip.reason { color: var(--steam); margin: 1px 0; }

  /* Spam: always expanded, one plain line per message. Sender and the whole
     subject stay readable so a human can spot the real customer Gmail misfiled. */
  .spam-list { list-style: none; margin: 0; padding: 0; background: var(--surface);
               border: 1px solid var(--line); border-radius: var(--radius); }
  .spam-row { display: grid; grid-template-columns: 70px minmax(180px, 280px) minmax(0, 1fr);
              gap: 12px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .spam-row + .spam-row { border-top: 1px solid #eef2f1; }
  .spam-row:hover, .spam-row:focus-visible { background: #f2f6f5; outline: none; }
  .spam-age { color: var(--steam); }
  .spam-from { color: var(--pine); overflow-wrap: anywhere; }
  .spam-subject { color: var(--pine); overflow-wrap: anywhere; }

  .empty {
    background: var(--surface); border: 1px dashed var(--line);
    border-radius: var(--radius); padding: 34px; text-align: center; color: var(--steam);
  }
  /* A stale or broken queue must never look like an empty one. */
  .empty.warning { border: 1px solid var(--brass); color: #6b4c12; background: #fbf5e8; }
  .empty.error { border: 1px solid var(--ember); color: var(--ember); background: #fbefe9; font-weight: 500; }
  .banner { margin-bottom: 14px; }
  .banner .empty { padding: 12px 16px; text-align: left; }

  /* Last successful sync per source. */
  #synced { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .sync { font-size: 12px; color: var(--steam); white-space: nowrap; }
  .sync.warning { color: #6b4c12; background: #fbf5e8; border: 1px solid var(--brass); border-radius: 20px; padding: 1px 8px; }
  .sync.error { color: #fff; background: var(--ember); border-radius: 20px; padding: 1px 8px; font-weight: 500; }

  .section-cut { margin: 8px 0 0; font-size: 12.5px; color: var(--steam); }
  .more { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 2px 10px; font-size: 12.5px; margin-left: 6px; }

  /* ---------- right panel ---------- */
  .panel {
    background: var(--surface);
    border-left: 1px solid var(--line);
    padding: 20px 20px 40px;
    display: flex; flex-direction: column; gap: 18px;
    overflow-y: auto; max-height: 100vh; position: sticky; top: 0;
  }
  .panel h3 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
  .panel .sub { font-size: 12.5px; color: var(--steam); }
  .section + .section { border-top: 1px solid var(--line); padding-top: 16px; }
  .section > .label { font-size: 12px; color: var(--steam); margin-bottom: 8px; }

  label.field { display: block; margin-bottom: 10px; }
  label.field span { display: block; font-size: 12.5px; color: var(--steam); margin-bottom: 3px; }
  select, textarea, input[type="text"] {
    width: 100%; font: inherit; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: #fff; color: var(--pine);
  }
  textarea { resize: vertical; min-height: 74px; }
  select:focus, textarea:focus, input:focus { outline: 2px solid var(--plunge); outline-offset: -1px; }

  .save {
    background: var(--pine); color: #fff; border: 0;
    padding: 8px 16px; border-radius: var(--radius); font-weight: 500;
  }
  .save:hover { background: #233831; }
  .save:disabled { background: #a9b6b2; cursor: not-allowed; }

  .log { display: flex; flex-direction: column; gap: 11px; }
  .log article { font-size: 13px; }
  .log .when { font-size: 12px; color: var(--steam); }
  .log p { margin: 2px 0 0; }

  .todo { display: flex; gap: 9px; align-items: flex-start; padding: 7px 0; }
  .todo + .todo { border-top: 1px solid #eef2f1; }
  .todo input { margin-top: 3px; }
  .todo .t { font-size: 13px; }
  .todo .d { font-size: 12px; color: var(--steam); }
  .todo.overdue .d { color: var(--ember); }

  .add-todo { display: flex; gap: 6px; margin-top: 10px; }
  .add-todo input { flex: 1; }
  .add-todo button {
    background: none; border: 1px solid var(--line);
    border-radius: var(--radius); padding: 0 12px; color: var(--steam);
  }

  @media (max-width: 1080px) {
    .shell { grid-template-columns: 1fr; }
    .panel { position: static; max-height: none; border-left: 0; border-top: 1px solid var(--line); }
    .rail { flex-direction: row; align-items: center; gap: 22px; padding: 12px 16px; }
    .rail nav { flex-direction: row; }
    .rail .heading, .rail .who { display: none; }
    .row { grid-template-columns: 4px 92px minmax(0,1fr) 90px; }
    .spam-row { grid-template-columns: 1fr; gap: 2px; }
    .row .who { display: none; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .cell, .row { transition: background 90ms linear; }
  }
</style>
</head>
<body>

<div class="shell">
  <aside class="rail">
    <div>
      <h1>Support console</h1>
      <div class="who" id="whoami">Loading…</div>
    </div>
    <div>
      <div class="heading">View</div>
      <nav id="views">
        <button data-view="board" aria-pressed="true">Everything</button>
        <button data-view="mine" aria-pressed="false">My queue</button>
        <button data-view="report" aria-pressed="false" id="reportView" hidden>Response times</button>
      </nav>
    </div>
    <div>
      <div class="heading">Brand</div>
      <nav id="brands"></nav>
    </div>
  </aside>

  <main>
    <div class="head">
      <div>
        <h2 id="title">Waiting on us</h2>
        <p id="subtitle"></p>
      </div>
      <p id="synced"></p>
    </div>

    <table class="matrix">
      <thead>
        <tr><th>Brand</th><th>Email</th><th>Phone</th><th>Chat</th></tr>
      </thead>
      <tbody id="matrix"></tbody>
    </table>

    <div class="banner" id="banner"></div>

    <div class="filters" id="filters">
      <button data-f="all" aria-pressed="true">All open</button>
      <button data-f="unassigned" aria-pressed="false">Unassigned</button>
      <button data-f="blocked" aria-pressed="false">Blocked</button>
      <button data-f="overdue" aria-pressed="false">Over 24h</button>
      <span class="filter-sep"></span>
      <button data-c="" aria-pressed="true">All channels</button>
      <button data-c="email" aria-pressed="false">Email</button>
      <button data-c="phone" aria-pressed="false">Phone</button>
    </div>

    <div id="queue"></div>
  </main>

  <aside class="panel" id="panel"></aside>
</div>

<script type="module">
import { SECTIONS, renderSection } from './queue-sections.mjs';
import { esc, threadHeaderHtml, historyHtml, todoRowHtml, matrixCellHtml, matrixCellView, todoListStatusHtml, assigneeHtml, unsubscribeHtml } from './render.mjs';
import { freshnessBadgeHtml, emptyQueueHtml } from './freshness.mjs';
import { reportHtml } from './report-view.mjs';
import { reloadLoadedPages } from './paging.mjs';

// ---------------------------------------------------------------
// Everything comes from the Worker's API. There is no mock data: a page that
// can't reach the API says so, and never shows an empty queue instead.
// ---------------------------------------------------------------

// The tabs the console shows today. THI and Reach Julian keep their rows in the
// brand table — THI is a real future tab — but nothing about them is on screen
// until there is a source behind them (round 14).
const BRANDS = [
  { id: 'inhouse',     name: 'InHouse Wellness' },
  { id: 'caliza',      name: 'Caliza Group' },
];
const TIERS = SECTIONS.map((s) => s.tier);
const REFRESH_MS = 60_000;

const emptyTier = () => ({ threads: [], total: 0, loaded: false });
const state = {
  view: 'board', brand: null, channel: null, filter: 'all', selected: null, detail: null,
  user: null, agents: [], board: [], sources: [], failures: [], serverNow: null, serverNowAt: 0,
  // Business-time boundaries from the server (round 15): the browser never does
  // business-hour arithmetic, it just compares timestamps (invariant 6).
  thresholds: null, report: null, reportError: null,
  tiers: Object.fromEntries(TIERS.map((t) => [t, emptyTier()])), pageSize: 50,
  todos: [], todosTotal: 0, todosLoaded: false, boardLoaded: false, error: null, loaded: false,
};

async function api(path, opts = {}) {
  const res = await fetch('/api/' + path, {
    ...opts,
    headers: { 'content-type': 'application/json', ...(opts.headers ?? {}) },
  });
  if (!res.ok) {
    let why = res.statusText;
    try { why = (await res.json()).error ?? why; } catch { /* not JSON */ }
    throw new Error(`${res.status} ${why}`);
  }
  return res.json();
}

const NOW = () => Math.floor(Date.now() / 1000);
/** The server's clock, advanced locally since the last board fetch: freshness never trusts the laptop clock. */
const serverNow = () => (state.serverNow ?? NOW()) + Math.floor((Date.now() - state.serverNowAt) / 1000);
const ageHours = (t) => (NOW() - t) / 3600;
// TODO: still wall-clock hours; must become business minutes (CLAUDE.md invariant 6).
const isBlocked = (t) => t.status === 'blocked';
const since = (t) => (isBlocked(t) ? t.blocked_since : t.awaiting_since);
const ageText = (t) => isBlocked(t)
  ? 'blocked' + (t.blocked_since == null ? '' : ' ' + ageLabel(t.blocked_since))
  : (t.awaiting_since == null ? '—' : ageLabel(t.awaiting_since));

function ageLabel(t) {
  const hrs = ageHours(t);
  if (hrs < 1) return Math.max(1, Math.round(hrs * 60)) + 'm';
  if (hrs < 48) return Math.round(hrs) + 'h';
  return Math.round(hrs / 24) + 'd';
}

/**
 * Fresh reads cold, stale reads hot — in BUSINESS hours (invariant 6). The
 * server sends the two boundaries with the board; an email that arrived at 17:05
 * on Friday is not four hours old on Saturday morning, and colouring it red
 * would have the agent chasing a clock nobody is measured against.
 * The age *label* stays wall-clock: "they wrote 3d ago" is a plain fact.
 */
function heatColor(awaitingSince) {
  const th = state.thresholds;
  if (awaitingSince == null) return 'var(--steam)';
  if (!th) return 'var(--steam)';
  if (awaitingSince > th.h4) return 'var(--plunge)';
  if (awaitingSince > th.h24) return 'var(--brass)';
  return 'var(--ember)';
}
/** Past 24 business hours, from the server's boundary. */
const overdue = (t) => state.thresholds != null && since(t) != null && since(t) <= state.thresholds.h24;
const brandName = (id) => BRANDS.find((b) => b.id === id)?.name ?? '—';

// --- loading ---------------------------------------------------------------------

const mineParam = () => (state.view === 'mine' ? '&mine=1' : '');
/** Channel and brand are applied by the database, so "N of M" is the truth (round 15). */
const scopeParams = () => (state.channel ? `&channel=${state.channel}` : '') + (state.brand ? `&brand=${encodeURIComponent(state.brand)}` : '');

async function loadBoard() {
  const b = await api('board');
  Object.assign(state, { user: b.user, agents: b.agents ?? [], board: b.board, failures: b.ingest_failures, sources: b.sources, serverNow: b.now, serverNowAt: Date.now(), thresholds: b.business_thresholds ?? null, boardLoaded: true });
}
async function loadReport() {
  try { state.report = await api('report'); state.reportError = null; }
  catch (err) { state.report = null; state.reportError = err.message; }
}
async function loadTier(tier, offset = 0) {
  const page = await api(`queue?tier=${tier}&offset=${offset}${mineParam()}${scopeParams()}`);
  const t = state.tiers[tier];
  t.threads = offset ? [...t.threads, ...page.threads] : page.threads;
  t.total = page.total;
  t.loaded = true;
  state.pageSize = page.page_size ?? state.pageSize;
}
async function loadTodos(more = false) {
  const page = await api('todos?offset=' + (more ? state.todos.length : 0));
  state.todos = more ? [...state.todos, ...page.todos] : page.todos;
  state.todosTotal = page.total;
  state.todosLoaded = true;
}
/** Refresh a tier without collapsing pages the agent opened. */
async function reloadTier(tier) {
  const t = state.tiers[tier];
  const r = await reloadLoadedPages(async (offset) => api(`queue?tier=${tier}&offset=${offset}${mineParam()}${scopeParams()}`), t.threads.length, state.pageSize);
  Object.assign(t, { threads: r.threads, total: r.total, loaded: true });
}
async function loadDetail(id) {
  state.detail = await api('threads/' + encodeURIComponent(id));
}

/** Run loaders; any failure is shown as an error, never as an empty queue. */
async function load(...loaders) {
  try {
    await Promise.all(loaders.map((f) => f()));
    state.error = null;
  } catch (err) {
    state.error = err.message;
  }
  state.loaded = true;
  render();
}
const loadQueue = () => Promise.all(TIERS.map((t) => loadTier(t)));
const reloadQueue = () => Promise.all(TIERS.map((t) => reloadTier(t)));

// --- rendering ---------------------------------------------------------------------

function renderRail() {
  document.getElementById('whoami').textContent =
    state.user ? state.user.email.split('@')[0] + ' · ' + state.user.role : 'Not signed in';

  const nav = document.getElementById('brands');
  nav.innerHTML = '';
  const mk = (id, name) => {
    const b = document.createElement('button');
    b.textContent = name;
    b.setAttribute('aria-pressed', String(state.brand === id));
    b.onclick = () => { state.brand = id; load(loadQueue); };
    nav.append(b);
  };
  mk(null, 'All brands');
  BRANDS.forEach((b) => mk(b.id, b.name));
}

function renderMatrix() {
  const body = document.getElementById('matrix');
  body.innerHTML = '';
  for (const brand of BRANDS) {
    const tr = document.createElement('tr');
    const th = document.createElement('th');
    th.textContent = brand.name;
    tr.append(th);

    for (const channel of ['email', 'phone', 'chat']) {
      // /api/board counts Needs-reply threads only: bulk and spam have their own section totals.
      const cell = state.board.find((r) => r.brand_id === brand.id && r.channel === channel);
      const count = cell?.waiting ?? 0;
      const oldest = cell?.oldest_at ?? null;
      const hrs = oldest ? ageHours(oldest) : 0;
      const view = matrixCellView({ brand: brand.id, count, oldestLabel: oldest ? ageLabel(oldest) : null, channel, sources: state.sources, now: serverNow(), loaded: state.boardLoaded && !state.error });
      const td = document.createElement('td');
      const btn = document.createElement('button');
      btn.className = 'cell' + (count ? '' : ' quiet');
      btn.innerHTML = matrixCellHtml({ count: view.count, oldest: view.note, fill: Math.min(100, (hrs / 48) * 100), color: heatColor(oldest), tone: view.tone });
      btn.onclick = () => { state.brand = brand.id; state.channel = channel === 'chat' ? null : channel; state.filter = 'all'; load(loadQueue); };
      btn.setAttribute('aria-label', view.count + ' waiting on ' + channel + ' for ' + brand.name + ', ' + view.note);
      td.append(btn);
      tr.append(td);
    }
    body.append(tr);
  }
}

// Brand and channel are applied by the database, so they do not make the totals
// a lie; only these three narrow what is already on the page.
const filtered = () => state.filter !== 'all';
function visible(threads) {
  let rows = threads;
  if (state.filter === 'unassigned') rows = rows.filter((t) => !t.assignee);
  if (state.filter === 'blocked') rows = rows.filter((t) => t.status === 'blocked');
  if (state.filter === 'overdue') rows = rows.filter(overdue);
  return rows;
}

function renderQueue() {
  const wrap = document.getElementById('queue');
  const customer = state.tiers.customer;
  document.getElementById('title').textContent = state.view === 'mine' ? 'My queue' : 'Waiting on us';
  const over = customer.threads.filter(overdue).length;
  const overText = over ? `, ${over}${customer.threads.length < customer.total && over === customer.threads.length ? '+' : ''} past 24 hours` : '';
  // The count is only printed once the queue itself has answered; the board
  // arrives first and used to paint "0 need a reply" over a full queue.
  document.getElementById('subtitle').textContent = customer.loaded && !state.error
    ? `${customer.total} need a reply${state.view === 'mine' ? ' (yours and unassigned)' : ' across all brands'}${overText}`
    : '';
  document.getElementById('synced').innerHTML = freshnessBadgeHtml(state.sources, serverNow(), esc);

  const banner = document.getElementById('banner');
  banner.innerHTML = state.error ? emptyQueueHtml({ sources: state.sources, now: serverNow(), apiError: state.error }, esc) : '';

  if (!state.loaded) {
    wrap.innerHTML = '<div class="empty">Loading…</div>';
    return;
  }
  if (state.error && !customer.loaded) {
    wrap.innerHTML = '';
    return;
  }

  // Three sections, nothing hidden; each tier paged separately with its own total.
  const sections = SECTIONS.map((s) => ({
    ...s,
    threads: visible(state.tiers[s.tier].threads),
    opts: {
      ageText, brandName, selected: state.selected,
      color: (t) => heatColor(since(t)),
      pageSize: state.pageSize,
      // "N of M" and the next-page control only mean something without a client-side filter.
      total: filtered() ? undefined : state.tiers[s.tier].total,
      emptyHtml: s.tier === 'customer' && !filtered() ? emptyQueueHtml({ sources: state.sources, now: serverNow(), apiError: state.error, loading: !state.tiers[s.tier].loaded }, esc) : null,
    },
  }));
  wrap.innerHTML = sections.map((section) => renderSection(section, esc, section.opts)).join('');
}

function renderPanel() {
  const panel = document.getElementById('panel');
  panel.innerHTML = '';
  if (state.selected) panel.append(threadDetail());
  panel.append(todoList());
}

function threadDetail() {
  const listed = TIERS.flatMap((t) => state.tiers[t].threads).find((x) => x.id === state.selected);
  const t = state.detail?.thread?.id === state.selected ? state.detail.thread : listed;
  const box = document.createElement('div');
  if (!t) return box;

  const frag = document.createElement('div');
  frag.className = 'section';
  frag.innerHTML = threadHeaderHtml(t, { brandName });
  // A link into the mailbox or the Quo inbox: the console shows what happened,
  // the provider is still where the conversation lives.
  const link = state.detail?.thread?.id === t.id ? state.detail.link : null;
  if (link) {
    const a = document.createElement('a');
    a.className = 'open-link';
    a.href = link;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = t.channel === 'phone' ? 'Open the conversation in Quo' : 'Open the thread in Gmail';
    frag.append(a);
  }

  // Assignment, and the unsubscribe the sender offered, both from the detail fetch.
  const assign = document.createElement('div');
  assign.className = 'section';
  assign.innerHTML = assigneeHtml({ agents: state.agents, assignee: t.assignee ?? null }, esc);
  const picker = assign.querySelector('#assignee');
  if (picker) {
    picker.onchange = async () => {
      const value = picker.value || null;
      picker.disabled = true;
      try {
        await api(`threads/${encodeURIComponent(t.id)}/assign`, { method: 'POST', body: JSON.stringify({ assignee: value }) });
      } catch (err) {
        assign.querySelector('#assignError').textContent = 'Not saved: ' + err.message;
        picker.disabled = false;
        return;
      }
      await load(reloadQueue, () => loadDetail(t.id));
    };
  }

  const unsub = document.createElement('div');
  const hasUnsub = state.detail?.thread?.id === t.id && !!state.detail.unsubscribe;
  if (hasUnsub) {
    unsub.className = 'section';
    unsub.innerHTML = unsubscribeHtml(state.detail.unsubscribe, esc);
  }

  const form = document.createElement('div');
  form.className = 'section';
  form.innerHTML =
    '<div class="label">Log what you did</div>' +
    '<label class="field"><span>Action</span>' +
      '<select id="kind">' +
        '<option value="replied">Replied</option>' +
        '<option value="called">Called</option>' +
        '<option value="note">Internal note</option>' +
        '<option value="escalated">Escalated</option>' +
      '</select></label>' +
    '<label class="field"><span>What you said or found</span>' +
      '<textarea id="body" placeholder="Quoted a replacement heater, waiting on their serial number."></textarea></label>' +
    '<label class="field"><span>Where does it stand now</span>' +
      '<select id="status">' +
        '<option value="answered">Answered — ball is with them</option>' +
        '<option value="blocked">Blocked — we are stuck</option>' +
        '<option value="waiting">Still needs a reply</option>' +
        '<option value="closed">Closed</option>' +
      '</select></label>' +
    '<label class="field" id="blockwrap" hidden><span>Blocked on</span>' +
      '<select id="blocked_on">' +
        '<option value="customer">Customer</option>' +
        '<option value="supplier">Supplier</option>' +
        '<option value="shipping">Shipping / carrier</option>' +
        '<option value="refund">Refund or billing</option>' +
        '<option value="owner">Owner sign-off</option>' +
        '<option value="other">Something else</option>' +
      '</select></label>' +
    '<button class="save" id="saveAction">Save action</button>' +
    '<p class="sub" id="saveError" role="alert"></p>';

  const statusSel = form.querySelector('#status');
  statusSel.onchange = () => { form.querySelector('#blockwrap').hidden = statusSel.value !== 'blocked'; };

  const save = form.querySelector('#saveAction');
  save.onclick = async () => {
    const payload = {
      thread_id: t.id,
      kind: form.querySelector('#kind').value,
      body: form.querySelector('#body').value.trim(),
      status: statusSel.value,
      blocked_on: statusSel.value === 'blocked' ? form.querySelector('#blocked_on').value : null,
    };
    save.disabled = true;
    try {
      await api('actions', { method: 'POST', body: JSON.stringify(payload) });
    } catch (err) {
      form.querySelector('#saveError').textContent = 'Not saved: ' + err.message;
      save.disabled = false;
      return;
    }
    // The server decides where the thread now stands; show that, not a guess.
    await load(loadBoard, reloadQueue, () => loadDetail(t.id));
  };

  const history = document.createElement('div');
  history.className = 'section';
  const log = state.detail?.thread?.id === t.id ? state.detail.actions : [];
  history.innerHTML = historyHtml(log, { ageLabel });

  box.append(frag, assign, form, history);
  if (hasUnsub) box.append(unsub);
  return box;
}

function todoList() {
  const wrap = document.createElement('div');
  wrap.className = 'section';
  wrap.innerHTML = '<div class="label">To do</div>';
  for (const td of state.todos) {
    const overdue = td.due_at && td.due_at < NOW();
    const row = document.createElement('div');
    row.className = 'todo' + (overdue ? ' overdue' : '');
    row.innerHTML = todoRowHtml(td, {
      brandName,
      dueText: td.due_at ? ' · due ' + (overdue ? ageLabel(td.due_at) + ' ago' : 'in ' + ageLabel(td.due_at)) : '',
    });
    row.querySelector('input').onchange = async () => {
      await load(async () => { await api('todos/' + td.id + '/done', { method: 'POST' }); await loadTodos(); });
    };
    wrap.append(row);
  }
  wrap.insertAdjacentHTML('beforeend', todoListStatusHtml({ loaded: state.todosLoaded, error: state.todosLoaded ? null : state.error, shown: state.todos.length, total: state.todosTotal }));
  const moreTodos = wrap.querySelector('[data-more-todos]');
  if (moreTodos) moreTodos.onclick = () => load(() => loadTodos(true));

  const add = document.createElement('div');
  add.className = 'add-todo';
  add.innerHTML = '<input type="text" placeholder="Add a to-do"><button>Add</button>';
  const input = add.querySelector('input');
  const submit = async () => {
    const title = input.value.trim();
    if (!title) return;
    await load(async () => {
      await api('todos', { method: 'POST', body: JSON.stringify({ title, brand_id: state.brand }) });
      await loadTodos();
    });
  };
  add.querySelector('button').onclick = submit;
  input.onkeydown = (e) => { if (e.key === 'Enter') submit(); };
  wrap.append(add);
  return wrap;
}

function renderReport() {
  const wrap = document.getElementById('queue');
  document.getElementById('title').textContent = 'Response times';
  document.getElementById('subtitle').textContent = state.report
    ? `Median first response, business hours only, last ${state.report.days} days`
    : '';
  if (state.reportError) {
    wrap.innerHTML = '';
    wrap.append(errorBanner('Could not load the report: ' + state.reportError));
    return;
  }
  wrap.innerHTML = state.report ? reportHtml(state.report, esc) : '<div class="empty">Loading…</div>';
}

/** An error the page builds itself, so no string from the server becomes markup. */
function errorBanner(text) {
  const div = document.createElement('div');
  div.className = 'empty error';
  div.setAttribute('role', 'alert');
  div.textContent = text;
  return div;
}

function render() {
  renderRail();
  const isReport = state.view === 'report';
  document.querySelector('.matrix').hidden = isReport;
  document.getElementById('filters').hidden = isReport;
  if (isReport) renderReport();
  else renderQueue();
  if (!isReport) renderMatrix();
  renderPanel();
  const reportBtn = document.getElementById('reportView');
  reportBtn.hidden = state.user?.role !== 'owner';
  for (const b of document.querySelectorAll('#views button'))
    b.setAttribute('aria-pressed', String(b.dataset.view === state.view));
  for (const b of document.querySelectorAll('#filters button')) {
    if (b.dataset.c !== undefined) b.setAttribute('aria-pressed', String((b.dataset.c || null) === state.channel));
    else b.setAttribute('aria-pressed', String(b.dataset.f === state.filter));
  }
}

// --- events ----------------------------------------------------------------------------

const queueEl = document.getElementById('queue');
queueEl.onclick = async (e) => {
  const more = e.target.closest('[data-more-tier]');
  if (more) {
    const tier = more.dataset.moreTier;
    more.disabled = true;
    await load(() => loadTier(tier, state.tiers[tier].threads.length));
    return;
  }
  const el = e.target.closest('[data-thread]');
  if (!el) return;
  state.selected = el.dataset.thread;
  state.detail = null;
  render();
  await load(() => loadDetail(state.selected));
};
queueEl.onkeydown = (e) => { if (e.key === 'Enter') queueEl.onclick(e); };

document.getElementById('views').onclick = async (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  state.view = b.dataset.view;
  await load(state.view === 'report' ? loadReport : loadQueue);
};
document.getElementById('filters').onclick = (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  // Channel is the server's filter, so it reloads; the rest narrow what is here.
  if (b.dataset.c !== undefined) {
    state.channel = b.dataset.c || null;
    load(loadQueue);
    return;
  }
  state.filter = b.dataset.f;
  render();
};

async function boot() {
  await load(loadBoard, loadTodos);
  if (state.user?.role === 'agent') state.view = 'mine';
  await load(loadQueue);
  // Keep ages and sync freshness current; a stopped ingest shows up without a reload.
  setInterval(() => {
    if (state.view === 'report') load(loadBoard, loadReport);
    else load(loadBoard, reloadQueue, loadTodos);
  }, REFRESH_MS);
}
boot();
</script>
</body>
</html>
