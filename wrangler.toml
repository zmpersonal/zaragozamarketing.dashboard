name = "inhouse-ops"
account_id = "0ef0279e4af302865cd2009458864c1b"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true
# Cloudflare Access protects this Worker; a preview URL would be another hostname to protect.
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "inhouse-ops"
database_id = "4f562bdf-560b-4c82-a84e-554aa8c2bcb7"

# No cron triggers: ingest runs on GitHub Actions (.github/workflows/ingest.yml),
# writing to this database through the D1 REST API. This Worker serves the UI and
# the API, behind Cloudflare Access. The Quo webhook is a separate Worker:
# wrangler.hooks.toml.

[vars]
ACCESS_TEAM = "dark-frost-948c"
ACCESS_AUD  = "48d796b48e451af9b69356a275b0b902a2ae9d622f1101c44eec5d3bdbcce2d9"
OWNERS      = "julian@inhousewellness.com, accounts@inhousewellness.com"
# Who a thread can be assigned to (round 15). Config, not a table: identity is
# the Access JWT plus these lists, and a person who cannot sign in should not be
# assignable. Marianne's and Charlie's addresses here are the obvious ones for
# this domain and MUST be checked against the Access policy before deploying:
# assigning to an address that cannot sign in hides the thread from them.
AGENTS      = "julian@inhousewellness.com, marianne@inhousewellness.com, charlie@inhousewellness.com"

# This Worker has no secrets. QUO_WEBHOOK_SECRET belongs to the hooks Worker (wrangler.hooks.toml).
#
# The ingest credentials are NOT Worker secrets any more. They live in GitHub
# Actions secrets for .github/workflows/ingest.yml:
#   GOOGLE_SERVICE_ACCOUNT_JSON, QUO_API_KEY,
#   CLOUDFLARE_API_TOKEN (D1 edit only), CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_D1_DATABASE_ID
