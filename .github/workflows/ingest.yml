# Hourly ingest: Gmail and Quo into D1, over Cloudflare's D1 REST API.
#
# The Worker (free plan) serves the dashboard, the API and the Quo webhook;
# ingest runs here because Workers Free caps a run at 50 outbound requests and
# 10 ms of CPU. Email is checked roughly hourly. GitHub can delay scheduled runs
# by 15-60 minutes under load.
#
# Minutes: GitHub Free allows 2,000 a month for a private repo. ~730 hourly runs;
# a normal run takes well under a minute (1 billed minute), and the 2-minute job
# timeout caps the worst case at 1,460. The ingest itself stops starting new work
# at 80 seconds (scripts/_ingest-run.mjs), so a run is never cut off mid-write.
name: Ingest

on:
  schedule:
    # Off the top of the hour, when GitHub's scheduler is busiest.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read  # check out the code
  actions: write  # keepalive: re-enable this workflow through the API (no commits)

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # GitHub disables scheduled workflows after 60 days of repository inactivity, silently.
      # Instead of committing (this workflow never commits or pushes, to main or anywhere),
      # re-enable it through the API on every scheduled run, which restarts the 60-day clock.
      # This is the approach of liskin/gh-workflow-keepalive and keepalive-workflow v2's
      # default mode; GitHub doesn't document what counts as activity. See HANDOFF.
      # Runs first, so a failing or timed-out ingest can't skip it.
      - name: Keepalive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          workflow="${GITHUB_WORKFLOW_REF%%@*}"
          workflow="${workflow#"${GITHUB_REPOSITORY}"/.github/workflows/}"
          if gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable" >/dev/null 2>&1; then
            echo "keepalive: re-enabled ${workflow} through the API"
          else
            echo "::warning title=keepalive::could not re-enable ${workflow} through the API; the schedule may be disabled after 60 quiet days"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ingest Gmail and Quo into D1
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          QUO_API_KEY: ${{ secrets.QUO_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: node scripts/ingest.mjs
